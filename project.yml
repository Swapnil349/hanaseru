# Generate the Xcode project on a Mac with:  xcodegen generate
# (brew install xcodegen). The .xcodeproj is generated, not committed.
name: Hanaseru
options:
  bundleIdPrefix: com.swapnil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  HanaseruKit:
    path: Packages/HanaseruKit

targets:
  Hanaseru:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: HanaseruKit
        product: LearningCore
      - package: HanaseruKit
        product: ConversationCore
      - package: HanaseruKit
        product: SessionCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hanaseru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Keeps a running session alive with the screen locked (hands-free use).
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Hanaseru listens during your turn so you can answer out loud. Audio is never recorded or stored."
        NSSpeechRecognitionUsageDescription: "Your Japanese answers are turned into text so the coach can respond. This happens on your iPhone when possible."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swapnil.hanaseru
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Set your team in Xcode (Signing & Capabilities) or here.
        DEVELOPMENT_TEAM: ""

schemes:
  Hanaseru:
    build:
      targets:
        Hanaseru: all
    run:
      config: Debug
    archive:
      config: Release
