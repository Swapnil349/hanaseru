# Builds the Android app on a GitHub-hosted Linux machine, so no Android Studio is needed.
#
# Artifacts on every run:
#   apk    Hanaseru.apk — download it on your Android phone and open it to install
#   logs   unit tests and the build
name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "Packages/HanaseruKit/Sources/LearningCore/Content/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/annotate.py"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        id: tests
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain testDebugUnitTest 2>&1 | tee ../android-tests.log

      - name: Annotate test failures
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        run: python3 .github/scripts/annotate.py android-tests.log "Android tests"

      - name: Build the APK
        id: build
        if: ${{ !cancelled() }}
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee ../android-build.log
          cp app/build/outputs/apk/release/app-release.apk ../Hanaseru.apk

      - name: Annotate build failures
        if: ${{ always() && steps.build.outcome == 'failure' }}
        run: python3 .github/scripts/annotate.py android-build.log "Android build"

      - name: Upload the APK
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Hanaseru.apk
          retention-days: 30

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            android-tests.log
            android-build.log
            android/app/build/reports/tests/
          if-no-files-found: ignore
