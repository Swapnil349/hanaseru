# Builds and checks the app on a GitHub-hosted Mac, so no local Mac is needed.
#
# Artifacts on every run:
#   logs          core tests, app build, UI tests, archive
#   screenshots   demo sessions played in the iOS Simulator (scripted voice, no microphone)
#   ipa           Hanaseru-unsigned.ipa — sign and install it on your iPhone from Windows
name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Records the coach's English with a natural neural voice (Kokoro, Apache-2.0); bundled into the app.
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reuse earlier recordings
        uses: actions/cache@v4
        with:
          path: voice-clips
          key: voice-${{ hashFiles('tools/voice/*.py', 'Packages/HanaseruKit/Sources/LearningCore/Content/*.json') }}
          restore-keys: voice-

      - name: Install the voice model
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile

      - name: Record the coach's English
        run: python tools/voice/build_clips.py voice-clips

      - uses: actions/upload-artifact@v4
        with:
          name: voice-clips
          path: voice-clips
          retention-days: 3

  build:
    needs: voice
    # The app still builds (with the iPhone voice) if recording failed.
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Add the natural English voice
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: voice-clips
          path: App/EnglishVoice

      # macos-15 can only run Xcode 26.x (Xcode 27 needs macOS 26.6), so latest-stable can't jump a major version.
      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Core package tests
        id: core
        working-directory: Packages/HanaseruKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../../core-tests.log

      - name: Annotate core test failures
        if: ${{ always() && steps.core.outcome == 'failure' }}
        run: python3 .github/scripts/annotate.py core-tests.log "Core tests"

      - name: Generate the Xcode project
        if: ${{ !cancelled() }}
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        if: ${{ !cancelled() }}
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build the app for the Simulator
        id: build
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Hanaseru.xcodeproj -scheme Hanaseru \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build 2>&1 | tee app-build.log

      - name: Annotate app build failures
        if: ${{ always() && steps.build.outcome == 'failure' }}
        run: python3 .github/scripts/annotate.py app-build.log "App build"

      - name: Play demo sessions in the Simulator
        id: ui
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Hanaseru.xcodeproj -scheme Hanaseru \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build -resultBundlePath UITests.xcresult 2>&1 | tee ui-tests.log

      - name: Annotate UI test failures
        if: ${{ always() && steps.ui.outcome == 'failure' }}
        run: python3 .github/scripts/annotate.py ui-tests.log "UI tests"

      - name: Export screenshots
        if: ${{ always() }}
        run: |
          mkdir -p screenshots
          if [ -d UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path UITests.xcresult --output-path screenshots || true
          fi

      - name: Build an unsigned IPA for iPhone
        id: archive
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Hanaseru.xcodeproj -scheme Hanaseru -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Hanaseru.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee archive.log
          mkdir -p Payload
          cp -R build/Hanaseru.xcarchive/Products/Applications/Hanaseru.app Payload/
          zip -qry Hanaseru-unsigned.ipa Payload

      - name: Annotate archive failures
        if: ${{ always() && steps.archive.outcome == 'failure' }}
        run: python3 .github/scripts/annotate.py archive.log "Archive"

      - name: Check the IPA contents
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          APP=Payload/Hanaseru.app
          test -x "$APP/Hanaseru" || { echo "::error::IPA has no Hanaseru executable"; exit 1; }
          find "$APP" -name phrases.json | grep -q . || { echo "::error::IPA is missing the Japanese content bundle"; exit 1; }
          INFO=$(plutil -p "$APP/Info.plist")
          for key in CFBundleIdentifier UIBackgroundModes NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription; do
            echo "$INFO" | grep -q "$key" || { echo "::error::Info.plist is missing $key"; exit 1; }
          done
          {
            echo "### IPA"
            echo "- Size: $(du -h Hanaseru-unsigned.ipa | cut -f1)"
            echo "- $(echo "$INFO" | grep -E '"CFBundleIdentifier"|"CFBundleShortVersionString"|"MinimumOSVersion"' | tr -s ' ' | paste -sd ',' -)"
            echo "- Content: $(find "$APP" -name '*.json' | wc -l | tr -d ' ') JSON files, background audio, microphone and speech permissions present"
            echo "- Natural English voice: $(find "$APP" -name '*.m4a' | wc -l | tr -d ' ') recorded sentences"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            *.log
            UITests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload IPA
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: Hanaseru-unsigned.ipa
          if-no-files-found: ignore
          retention-days: 14
